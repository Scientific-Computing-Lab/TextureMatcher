[project]
name = "gpt-image-midpoints"
version = "0.1.0"
description = "Reproducible Azure GPT Image texture-midpoint experiment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "openai>=1.70",
  "pillow>=10.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]
evaluation = [
  "lpips==0.1.4",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "transformers==4.48.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
package = false
